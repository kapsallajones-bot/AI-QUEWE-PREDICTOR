<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meridian Bank — Queue Intelligence</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "Inter Tight", "Segoe UI", system-ui, sans-serif;
        color: #f8fafc;
        background: radial-gradient(120% 120% at 0% 0%, #1d4ed8 0%, #0b1220 55%, #060b16 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-user-select: none;
        border-radius: 16px;
      }
      .glow {
        position: absolute;
        width: 420px; height: 420px;
        border-radius: 50%;
        filter: blur(90px);
        opacity: .35;
      }
      .glow.a { background: #3b82f6; top: -140px; left: -120px; }
      .glow.b { background: #06b6d4; bottom: -160px; right: -120px; }
      .wrap { position: relative; text-align: center; padding: 40px 48px; }
      .logo {
        width: 78px; height: 78px; margin: 0 auto 22px;
        display: grid; place-items: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        box-shadow: 0 18px 40px -12px rgba(37, 99, 235, .8);
      }
      .logo svg { width: 38px; height: 38px; stroke: #fff; }
      h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
      p.sub { margin-top: 6px; font-size: 13px; color: #94a3b8; }
      .bar {
        margin: 28px auto 0; width: 260px; height: 4px;
        border-radius: 999px; background: rgba(148,163,184,.22); overflow: hidden;
      }
      .bar span {
        display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #38bdf8, #2563eb);
        animation: slide 1.25s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
      .status { margin-top: 14px; font-size: 12px; color: #64748b; letter-spacing: .08em; text-transform: uppercase; }
      .foot { position: absolute; bottom: 16px; left: 0; right: 0; font-size: 11px; color: #475569; }
    </style>
  </head>
  <body>
    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="wrap">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3" />
        </svg>
      </div>
      <h1>Meridian Bank</h1>
      <p class="sub">Queue Intelligence Terminal v4.2</p>
      <div class="bar"><span></span></div>
      <div class="status" id="status">Starting services…</div>
    </div>
    <div class="foot">Secured connection · Branch BR-014 Douala Akwa</div>
    <script>
      const steps = [
        "Starting services…",
        "Loading AI prediction model…",
        "Syncing queue data…",
        "Preparing workspace…",
      ];
      let i = 0;
      setInterval(() => {
        i = (i + 1) % steps.length;
        document.getElementById("status").textContent = steps[i];
      }, 1100);
    </script>
  </body>
</html>
